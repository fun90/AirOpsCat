name: Go CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go 检查
        env:
          CGO_ENABLED: '0'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo '以上文件未 gofmt'; exit 1; }
          go generate ./internal/probeassets
          test -s internal/probeassets/assets/probe-linux-amd64.gz
          test -s internal/probeassets/assets/probe-linux-arm64.gz
          go vet ./...
          go test ./...
      - name: 安装器检查
        run: |
          bash -n deploy/install.sh
          bash deploy/install.sh --self-test
      - name: 前端回归检查
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          test -n "$CHROME_BIN" || { echo '缺少 Chrome/Chromium，拒绝跳过浏览器回归'; exit 1; }
          CHROME_BIN="$CHROME_BIN" node --test scripts/nav-progress.test.mjs
