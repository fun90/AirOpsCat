name: Go release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验发布来源
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin refs/heads/release/go:refs/remotes/origin/release/go
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/release/go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 确认同一提交 CI 已通过
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          echo "同一提交 CI 成功次数: $n"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
      - name: 检查与构建
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
          CI_PASSED: ${{ steps.ci.outputs.passed }}
        run: |
          go generate ./internal/probeassets
          test -s internal/probeassets/assets/probe-linux-amd64.gz
          test -s internal/probeassets/assets/probe-linux-arm64.gz
          if [ "$CI_PASSED" != true ]; then
            echo '未找到该提交通过的 CI，发布前补跑检查'
            go vet ./...
            go test ./...
          fi
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -tags timetzdata \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/airopscat-linux-$arch" ./cmd/airopscat
            tar -czf "dist/airopscat-linux-$arch.tar.gz" -C dist "airopscat-linux-$arch"
            rm "dist/airopscat-linux-$arch"
          done
          cp deploy/systemd/airopscat.service deploy/install.sh dist/
          (cd dist && sha256sum airopscat-linux-*.tar.gz airopscat.service install.sh > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.repository == 'fun90/AirOpsCat' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 再次校验 tag 与分支
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin refs/heads/release/go:refs/remotes/origin/release/go
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/release/go
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          gh release create "$TAG" dist/* --repo fun90/AirOpsCat \
            --verify-tag --title "AirOpsCat $TAG" --generate-notes
