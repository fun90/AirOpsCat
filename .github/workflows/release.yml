name: Go release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验发布来源
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin refs/heads/release/go:refs/remotes/origin/release/go
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/release/go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          go generate ./internal/probeassets
          test -s internal/probeassets/assets/probe-linux-amd64.gz
          test -s internal/probeassets/assets/probe-linux-arm64.gz
          mkdir -p dist
          GOOS=linux GOARCH="$ARCH" go build -trimpath -tags timetzdata \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/airopscat-linux-$ARCH" ./cmd/airopscat
          tar -czf "dist/airopscat-linux-$ARCH.tar.gz" -C dist "airopscat-linux-$ARCH"
          rm "dist/airopscat-linux-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: 汇总与校验和
        run: |
          cp deploy/systemd/airopscat.service deploy/install.sh dist/
          (cd dist && sha256sum airopscat-linux-*.tar.gz airopscat.service install.sh > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: github.repository == 'fun90/AirOpsCat' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 再次校验 tag 与分支
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin refs/heads/release/go:refs/remotes/origin/release/go
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/release/go
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          gh release create "$TAG" dist/* --repo fun90/AirOpsCat \
            --verify-tag --title "AirOpsCat $TAG" --generate-notes
