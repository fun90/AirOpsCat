# AirOpsCat Subscription Config for Stash
# Generated at: {timestamp}
# Account: {account.uuid}

mode: rule
ipv6: true
log-level: error
allow-lan: false
unified-delay: true
global-client-fingerprint: chrome
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb


mixed-port: 7890

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    
profile:
  store-selected: true

proxies:
{#for node in nodes}
  - name: {node.name}
    type: {node.inbound.protocol ?: ''}
    server: {node.serverHost}
    port: {node.port}
    uuid: {account.uuid}
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
  {#if node.protocol == 'vless-reality'}
    servername: {node.inbound.streamSettings.realitySettings.serverNames[0]}
    reality-opts:
      public-key: {node.inbound.streamSettings.realitySettings.publicKey}
      short-id: {node.inbound.streamSettings.realitySettings.shortIds[0]}
  {#else}
    skip-cert-verify: true
  {/if}
    client-fingerprint: chrome
{/for}

proxy-groups:
  - name: 代理
    icon: https://static.fun90.com/clash/Proxy.png
    type: select
    proxies:
      - 自动
      - 直连
      {#for node in nodes}
      - {node.name}
      {/for}
  - name: Microsoft
    icon: https://static.fun90.com/clash/Microsoft.png
    type: select
    proxies:
      - 代理
      - 直连
      {#for node in nodes}
      - {node.name}
      {/for}
  - name: Apple
    icon: https://static.fun90.com/clash/Apple_1.png
    type: select
    proxies:
      - 直连
      - 代理
      {#for node in nodes}
      - {node.name}
      {/for}
  - name: 自动
    icon: https://static.fun90.com/clash/Auto.png
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      {#for node in nodes}
      - {node.name}
      {/for}
  - name: 直连
    icon: https://static.fun90.com/clash/Direct.png
    type: select
    proxies:
      - DIRECT

rule-providers:
  hst:
    type: http
    behavior: classical
    url: {subscriptionUrl}/rules/clash/hst.yaml
    path: ./ruleset/hst.yaml
    interval: 86400
  myreject:
    type: http
    behavior: classical
    url: "{subscriptionUrl}/rules/clash/myreject.yaml"
    path: ./ruleset/myreject.yaml
    interval: 86400
  mydirect:
    type: http
    behavior: classical
    url: "{subscriptionUrl}/rules/clash/mydirect.yaml"
    path: ./ruleset/mydirect.yaml
    interval: 86400
  myproxy:
    type: http
    behavior: classical
    url: "{subscriptionUrl}/rules/clash/myproxy.yaml"
    path: ./ruleset/myproxy.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
  Apple:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Apple/Apple.yaml"
    path: ./ruleset/Apple.yaml
    interval: 86400
  Microsoft:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Microsoft/Microsoft.yaml"
    path: ./ruleset/Microsoft.yaml
    interval: 86400
  ChinaIPs_IP:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ChinaIPs/ChinaIPs_IP.yaml"
    path: ./ruleset/ChinaIPs_IP.yaml
    interval: 86400
  China_Domain:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/China/China_Domain.yaml"
    path: ./ruleset/China_Domain.yaml
    interval: 86400

rules:
  - DOMAIN-SUFFIX,fun90.com,DIRECT
  - RULE-SET,hst,DIRECT
  - RULE-SET,myreject,REJECT
  - RULE-SET,mydirect,DIRECT
  - RULE-SET,myproxy,代理
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,Apple,DIRECT
  - RULE-SET,Microsoft,代理
  - RULE-SET,ChinaIPs_IP,DIRECT
  - RULE-SET,China_Domain,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,代理