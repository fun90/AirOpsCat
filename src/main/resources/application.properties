# \u5E94\u7528\u914D\u7F6E
quarkus.application.name=AirOpsCat
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# \u6570\u636E\u6E90\u914D\u7F6E
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:root}
quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:airopscat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver
# \u6570\u636E\u5E93\u8FDE\u63A5\u6C60\u914D\u7F6E
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30s

# Hibernate ORM \u914D\u7F6E
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
quarkus.hibernate-orm.log.format-sql=false
# \u6DFB\u52A0\u547D\u540D\u7B56\u7565 - \u4F7F\u7528\u4E0B\u5212\u7EBF\u547D\u540D
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# \u65E5\u5FD7\u914D\u7F6E
quarkus.log.level=INFO
quarkus.log.category."com.fun90.airopscat".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=INFO
quarkus.log.category."io.quarkus.security".level=INFO
quarkus.log.file.enable=false
quarkus.log.file.path=./logs/airopscat.log
quarkus.log.file.rotation.max-backup-index=7
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=false
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} [%-5p] [%t] [%l] - %m%e%n
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} [%-5p] [%t] [%l] - %m%e%n

# HTTP\u5B89\u5168\u914D\u7F6E - \u8868\u5355\u8BA4\u8BC1
quarkus.http.auth.basic=false
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/dashboard
quarkus.http.auth.form.timeout=30M
quarkus.http.auth.form.username-parameter=email
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.http-only-cookie=true

# \u6743\u9650\u914D\u7F6E
# \u516C\u5171\u8BBF\u95EE\u8DEF\u5F84
quarkus.http.auth.permission.public.paths=/static/*,/login,/api/logout,/register,/subscribe/*,/api/open/*,/favicon.ico,/error/*
quarkus.http.auth.permission.public.policy=permit

# \u5065\u5EB7\u68C0\u67E5\u8DEF\u5F84
quarkus.http.auth.permission.health.paths=/q/health/*,/q/metrics/*
quarkus.http.auth.permission.health.policy=permit

# \u7BA1\u7406\u5458\u89D2\u8272\u8BBF\u95EE
quarkus.http.auth.permission.admin.paths=/api/admin/*
quarkus.http.auth.permission.admin.policy=admin-policy

# \u5408\u4F5C\u4F19\u4F34\u89D2\u8272\u8BBF\u95EE
quarkus.http.auth.permission.partner.paths=/api/partner/*
quarkus.http.auth.permission.partner.policy=partner-policy

# VIP\u89D2\u8272\u8BBF\u95EE
quarkus.http.auth.permission.vip.paths=/api/vip/*
quarkus.http.auth.permission.vip.policy=vip-policy

# \u5176\u4ED6\u6240\u6709\u8DEF\u5F84\u9700\u8981\u8BA4\u8BC1
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# \u89D2\u8272\u7B56\u7565\u5B9A\u4E49
quarkus.http.auth.policy.admin-policy.roles-allowed=ADMIN
quarkus.http.auth.policy.partner-policy.roles-allowed=ADMIN,PARTNER
quarkus.http.auth.policy.vip-policy.roles-allowed=ADMIN,PARTNER,VIP

# \u9759\u6001\u8D44\u6E90\u914D\u7F6E
quarkus.http.enable-compression=true
quarkus.thread-pool.core-threads=1
quarkus.thread-pool.max-threads=8
airopscat.thread.blocking.core-size=2
airopscat.thread.blocking.max-size=8
airopscat.thread.blocking.queue-capacity=64
airopscat.thread.blocking.keep-alive-seconds=60

# \u5B89\u5168headers\u914D\u7F6E
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-XSS-Protection".value=1; mode=block
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# CORS\u914D\u7F6E
quarkus.http.cors.enabled=true
# \u751F\u4EA7\u73AF\u5883\uFF1A\u4EC5\u5141\u8BB8\u7279\u5B9A\u6765\u6E90
%prod.quarkus.http.cors.origins=https://yourdomain.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Accept,Origin
quarkus.http.cors.access-control-allow-credentials=true

# Qute \u6A21\u677F\u914D\u7F6E
quarkus.qute.property-not-found-strategy=throw-exception
quarkus.qute.remove-standalone-lines=true
quarkus.qute.strict-rendering=true

# gRPC \u5BA2\u6237\u7AEF\u914D\u7F6E
quarkus.grpc.codegen.skip=true
quarkus.grpc.clients.sing-box.host=127.0.0.1
quarkus.grpc.clients.sing-box.port=${airopscat.sing-box.grpc.local-port}
quarkus.grpc.clients.sing-box.plain-text=true
quarkus.grpc.clients.sing-box.use-quarkus-grpc-client=true
quarkus.scheduler.start-mode=forced

# \u81EA\u5B9A\u4E49\u914D\u7F6E
airopscat.ssh.provider=jsch
airopscat.sing-box.grpc.local-port=11011
airopscat.subscription.url=http://localhost:8080/subscribe
airopscat.crypto.secret-key=AirOpsCatDefaultSecretKey2024
airopscat.online.check-minutes=5
airopscat.apple.id=your_apple_id_here
airopscat.apple.pwd=your_apple_pwd_here
airopscat.domain=yourdomain.com
airopscat.api.token=your_api_token_here
airopscat.docs.url=https://docs.xxx.com
airopscat.config.templates.dir=./config
airopscat.install.remote-work-dir=/tmp/airopscat-installer
airopscat.server.monitor.enabled=true
airopscat.server.monitor.refresh-minutes=1
airopscat.server.monitor.retention-days=30
airopscat.server.monitor.cleanup.cron=0 0 3 * * ?
airopscat.server.monitor.alert.cron=0 */5 * * * ?
airopscat.server.traffic.notify.cron=0 10 10 * * ?
airopscat.server.monitor.alert.cpu-threshold=0.9
airopscat.server.monitor.alert.memory-threshold=0.95
airopscat.server.monitor.alert.traffic-threshold=0.85
airopscat.server.monitor.alert.continuous-minutes=30
airopscat.backup.dir=./backup
airopscat.backup.cron=0 0 6 * * ?
airopscat.backup.cleanup.cron=0 30 6 * * ?
airopscat.backup.retention-days=30
airopscat.backup.mysqldump-path=mysqldump
airopscat.account.expiration.cron=0 0 5 * * ?
airopscat.expiration.notify.cron=0 0 10 * * ?
airopscat.traffic.stats.cron=0 */15 * * * ?
airopscat.core.config.cleanup.cron=0 0 8 * * ?
airopscat.deployment.skip-remote-config=false
