<div class="card-body border-bottom">
    <!-- 交易统计卡片 -->
    <div class="row">
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-primary text-white avatar">
                                <i class="ti ti-exchange"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                总交易金额
                            </div>
                            <div class="text-muted">
                                ¥ {{ formatCurrency(parseFloat(stats.totalIncome) + parseFloat(stats.totalExpense)) }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-green text-white avatar">
                                <i class="ti ti-arrow-up"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                总收入
                            </div>
                            <div class="text-muted">
                                ¥ {{ formatCurrency(stats.totalIncome) }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-red text-white avatar">
                                <i class="ti ti-arrow-down"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                总支出
                            </div>
                            <div class="text-muted">
                                ¥ {{ formatCurrency(stats.totalExpense) }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-yellow text-white avatar">
                                <i class="ti ti-wallet"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                净收入
                            </div>
                            <div class="text-muted" :class="parseFloat(stats.netBalance) >= 0 ? 'text-success' : 'text-danger'">
                                ¥ {{ formatCurrency(stats.netBalance) }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 收支趋势图 -->
<div class="card-body border-bottom">
    <h3 class="card-title">收支趋势</h3>
    <div class="chart-container" style="height: 350px;">
        <div id="trends-chart" style="width: 100%; height: 100%"></div>
    </div>
</div>
