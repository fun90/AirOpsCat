<div class="card-body border-bottom">
    <div class="row">
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-primary text-white avatar">
                                <i class="ti ti-tag"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                总标签数
                            </div>
                            <div class="text-muted">
                                {{ stats.total || 0 }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-green text-white avatar">
                                <i class="ti ti-circle-check"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                启用标签
                            </div>
                            <div class="text-muted">
                                {{ stats.enabled || 0 }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-red text-white avatar">
                                <i class="ti ti-ban"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                禁用标签
                            </div>
                            <div class="text-muted">
                                {{ stats.disabled || 0 }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <span class="bg-blue text-white avatar">
                                <i class="ti ti-link"></i>
                            </span>
                        </div>
                        <div class="col">
                            <div class="font-weight-medium">
                                关联关系
                            </div>
                            <div class="text-muted">
                                管理标签关联
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
