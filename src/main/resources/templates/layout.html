<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>后台管理系统</title>
    <link rel="icon" href="/static/img/favicon.png"/>
    <script src="/static/js/common/theme.js"></script>
    <!-- BEGIN GLOBAL MANDATORY STYLES -->
    <link rel="stylesheet" href="/static/tabler/css/tabler.min.css" />
    <link rel="stylesheet" href="/static/tabler/css/tabler-icons.min.css" />
    <!-- END GLOBAL MANDATORY STYLES -->
    <!-- BEGIN PLUGINS STYLES -->
    {#if requiresTomSelect}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.css" />
    {/if}
    <!-- END PLUGINS STYLES -->

    <!-- Custom styles for autosize in modals -->
    <style>
        /* 优化 Modal 中的 autosize textarea */
        .modal textarea[data-bs-toggle="autosize"] {
            min-height: 2.5rem;
            max-height: 60vh;
            transition: height 0.2s ease;
        }

        /* 确保 textarea 在 tab 切换时正确显示 */
        .tab-pane textarea[data-bs-toggle="autosize"] {
            min-height: 2.5rem;
        }

        /* 移动端响应式logo样式 */
        .logo-responsive {
            /*transition: height 0.2s ease;*/
        }

        /* 移动端调整logo高度 */
        @media (max-width: 575.98px) {
            .logo-responsive {
                height: 32px !important;
            }
        }

        /* 小屏幕平板调整logo高度 */
        @media (max-width: 767.98px) {
            .logo-responsive {
                height: 36px !important;
            }
        }

        /* 移动端数据表格优化 */
        @media (max-width: 767.98px) {
            /* 优化分页控件 */
            .pagination .page-link {
                padding: 0.375rem 0.5rem;
                font-size: 0.875rem;
            }

            /* 隐藏部分页码，只显示当前页和前后页 */
            .pagination .page-item:not(.active):not(:first-child):not(:last-child):not(:nth-child(2)):not(:nth-last-child(2)) {
                display: none;
            }

            /* 优化表格操作按钮 */
            .btn-list .btn-sm {
                padding: 0.25rem 0.5rem;
                font-size: 0.75rem;
            }

            /* 优化下拉菜单 */
            .dropdown-menu {
                min-width: 150px;
            }

            /* 表格文本截断优化 */
            .table-responsive .table td {
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* 特定表格列的移动端优化 - 隐藏不太重要的列 */
            .table-responsive .table td:nth-child(n+5):not(:last-child) {
                display: none;
            }

            .table-responsive .table th:nth-child(n+5):not(:last-child) {
                display: none;
            }

            /* 保持操作列可见 */
            .table-responsive .table td:last-child,
            .table-responsive .table th:last-child {
                display: table-cell !important;
                min-width: 80px;
            }

            /* 对于特定表格，可以添加更精细的控制 */
            .table-responsive .table.table-account td:nth-child(5),
            .table-responsive .table.table-account th:nth-child(5) {
                display: table-cell !important; /* 保持账户状态列可见 */
            }

            /* 卡片头部搜索框在移动端的优化 */
            .card-header .row .col {
                min-width: 0;
            }

            .card-header .form-control {
                min-width: 120px;
            }
        }

        /* 超小屏幕优化 */
        @media (max-width: 575.98px) {
            /* 隐藏更多分页项 */
            .pagination .page-item:not(.active):not(:first-child):not(:last-child) {
                display: none;
            }

            /* 分页文本简化 */
            .card-footer .text-muted {
                font-size: 0.75rem;
            }

            /* 页面选择器简化 */
            .form-select-sm {
                font-size: 0.75rem;
            }

            /* Sidebar 移动端优化 */
            .navbar-vertical.navbar-expand-lg {
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }

            .navbar-vertical .navbar-nav .nav-link {
                padding: 0.5rem 1rem;
            }

            .navbar-vertical .navbar-nav .nav-link-icon {
                margin-right: 0.5rem;
            }

            /* 移动端下拉菜单项优化 */
            .navbar-vertical .dropdown-menu .dropdown-item {
                padding: 0.375rem 1rem;
                font-size: 0.875rem;
            }

            /* 更隐藏更多表格列 */
            .table-responsive .table td:nth-child(n+4):not(:last-child) {
                display: none;
            }

            .table-responsive .table th:nth-child(n+4):not(:last-child) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="layout-fluid" @vue:mounted="mounted">
        <!--  BEGIN SIDEBAR  -->
        {#include fragments/common/sidebar /}
        <!--  END SIDEBAR  -->

        <div class="page-wrapper">
            <!-- BEGIN PAGE HEADER -->
            {#include page-header /}
            <!-- END PAGE HEADER -->

            <!-- BEGIN PAGE BODY -->
            {#insert page-body /}
            <!-- END PAGE BODY -->

            <!-- 页脚 -->
            {#include fragments/common/footer /}
        </div>
    </div>

    <!-- BEGIN GLOBAL MANDATORY SCRIPTS -->
    <script src="/static/js/petite-vue.umd.js"></script>
    {#if requiresTomSelect}
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    {/if}
    <script type="module" src="/static/js/common/autosize.min.js"></script>
    <script type="module" src="/static/js/common/modal-autosize.js"></script>
    <script type="module" src="/static/js/common/toast-utils.js"></script>
    <!-- END GLOBAL MANDATORY SCRIPTS -->

    <!-- BEGIN PAGE SCRIPTS -->

    <script type="module" src="/static/js{uri}.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 初始化页面中的 autosize（非 Modal 中的元素）
            function initPageAutosize() {
                if (typeof autosize === 'undefined') return;

                const textareas = document.querySelectorAll('textarea[data-bs-toggle="autosize"]:not(.modal textarea[data-bs-toggle="autosize"])');
                if (textareas.length > 0) {
                    autosize(textareas);
                }
            }

            // 初始化页面中的 autosize
            initPageAutosize();
        });
    </script>
    <!-- END PAGE SCRIPTS -->

</body>
</html>
