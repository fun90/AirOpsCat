<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AirOpsCat" />
    <link rel="apple-touch-icon" href="/static/img/logo.png" />
    <title>登录 - {appName ?: 'AirOpsCat'}</title>
    <link rel="icon" href="/static/img/favicon.png"/>
    <script src="/static/js/common/theme.js"></script>
    <!-- Tabler UI CSS -->
    <link rel="stylesheet" href="/static/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="/static/tabler/css/tabler-icons.min.css">

    <style>
        .login-logo {
            height: 96px;
            max-width: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
    <div class="container container-tight py-4">

        <div class="text-center mb-4">
            <picture>
                <source srcset="/static/img/logo-dark.png" media="(prefers-color-scheme: dark)">
                <img src="/static/img/logo-light.png" class="login-logo" alt="{appName ?: 'AirOpsCat'}">
            </picture>
        </div>

        <div class="card card-md">
            <div class="card-body">
                <h2 class="h2 text-center mb-4">登录您的账户</h2>

                {#if error && error != ""}
                <div class="alert alert-danger alert-dismissible" role="alert">
                    <div class="d-flex">
                        <i class="ti ti-alert-triangle fs-2 me-2"></i>
                        <div>{error}</div>
                    </div>
                    <a class="btn-close" data-dismiss-alert aria-label="关闭"></a>
                </div>
                {/if}

                <form action="/j_security_check" method="POST" id="login-form">
                    <div class="mb-3">
                        <label class="form-label" for="email">邮箱地址</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com"
                               required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">密码</label>
                        <div class="input-group input-group-flat">
                            <input type="password" id="password" name="password" class="form-control" placeholder="您的密码"
                                   required autocomplete="current-password">
                            <span class="input-group-text">
                                <button type="button" class="btn btn-link link-secondary p-0 border-0" id="password-toggle"
                                        aria-label="显示密码" title="显示密码">
                                    <i class="ti ti-eye"></i>
                                </button>
                            </span>
                        </div>
                        <div class="form-hint mt-2" id="caps-hint" hidden>
                            <i class="ti ti-alert-circle"></i> 大写锁定已开启
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-check">
                            <input type="checkbox" name="remember" class="form-check-input">
                            <span class="form-check-label">记住我（保持登录 14 天）</span>
                        </label>
                    </div>

                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100" id="login-submit">登录</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center text-muted mt-3">
            <small>忘记密码或需要开通账户，请联系管理员</small>
        </div>
        <div class="text-center text-muted mt-1">
            <small>© <span id="year"></span> {appName ?: 'AirOpsCat'}</small>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('login-form');
        const password = document.getElementById('password');
        const toggle = document.getElementById('password-toggle');
        const submit = document.getElementById('login-submit');

        document.getElementById('year').textContent = new Date().getFullYear();

        // 显示/隐藏密码
        toggle.addEventListener('click', function () {
            const show = password.type === 'password';
            password.type = show ? 'text' : 'password';
            const label = show ? '隐藏密码' : '显示密码';
            toggle.setAttribute('aria-label', label);
            toggle.title = label;
            toggle.firstElementChild.className = show ? 'ti ti-eye-off' : 'ti ti-eye';
        });

        // 大写锁定提示
        password.addEventListener('keyup', function (e) {
            document.getElementById('caps-hint').hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
        });
        password.addEventListener('blur', function () {
            document.getElementById('caps-hint').hidden = true;
        });

        // 关闭错误提示
        document.querySelectorAll('[data-dismiss-alert]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                btn.closest('.alert').remove();
            });
        });

        // 防止重复提交
        form.addEventListener('submit', function () {
            submit.disabled = true;
            submit.classList.add('btn-loading');
        });
        // 从 bfcache 返回时恢复按钮
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) {
                submit.disabled = false;
                submit.classList.remove('btn-loading');
            }
        });
    });
</script>
</body>
</html>
