<div class="card-body border-bottom">
    <div class="row g-2">
        <div class="col-3">
            <div class="text-center">
                <div class="text-primary fw-bold h4 mb-0">{{ stats.total || 0 }}</div>
                <div class="text-muted small">总服务器</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-success fw-bold h4 mb-0">{{ stats.active || 0 }}</div>
                <div class="text-muted small">活跃</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-danger fw-bold h4 mb-0">{{ stats.expired || 0 }}</div>
                <div class="text-muted small">已过期</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-warning fw-bold h4 mb-0">¥ {{ parseFloat(totalCost).toFixed(2) }}</div>
                <div class="text-muted small">总成本</div>
            </div>
        </div>
    </div>
</div>
