<div class="page-body">
    <div class="container-xl">
        <!-- Use the common data table template -->
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <div class="card-actions">
                        <div class="row g-2">
                            <!-- Search input -->
                            <div class="col">
                                <input type="text" class="form-control" placeholder="搜索..." v-model="searchQuery" @input="searchDebounced">
                            </div>

                            <!-- Filters -->
                            {#include device/server/filters /}
                        </div>
                    </div>
                </div>

                <!-- Stats Cards -->
                {#include device/server/stats /}

                <div class="table-responsive">
                    <!-- Table content -->
                    {#include device/server/table /}
                </div>

                <!-- Pagination controls -->
                {#include pagination-controls /}

                <!-- Delete Confirmation Modal -->
                <div class="modal modal-blur fade" id="server-deleteModal" tabindex="-1" role="dialog">
                    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
                        <div class="modal-content">
                            <div class="modal-body">
                                <div class="modal-title">确定删除吗?</div>
                                <div>若确认删除，数据将无法恢复</div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">取消</button>
                                <button type="button" class="btn btn-danger" @click="deleteItem">确认</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Server specific modals -->
                {#include device/server/modals /}
            </div>
        </div>
    </div>
</div>
