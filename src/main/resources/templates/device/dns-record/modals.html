<div class="modal modal-blur fade" id="dns-record-createModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加 DNS 记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label required">类型</label>
                    <select class="form-select" :class="{ 'is-invalid': validationErrors.type }" v-model="newItem.type">
                        <option v-for="recordType in dnsRecordTypes" :key="recordType" :value="recordType">{{ recordType }}</option>
                    </select>
                    <div class="invalid-feedback" v-if="validationErrors.type">{{ validationErrors.type }}</div>
                </div>
                <div class="mb-3">
                    <label class="form-label required">名称</label>
                    <input type="text" class="form-control" :class="{ 'is-invalid': validationErrors.name }" v-model="newItem.name" placeholder="@ 或子域名">
                    <div class="invalid-feedback" v-if="validationErrors.name">{{ validationErrors.name }}</div>
                </div>
                <div class="mb-3">
                    <label class="form-label required">内容</label>
                    <textarea class="form-control" rows="3" :class="{ 'is-invalid': validationErrors.content }" v-model="newItem.content" placeholder="IP、别名或文本内容"></textarea>
                    <div class="invalid-feedback" v-if="validationErrors.content">{{ validationErrors.content }}</div>
                </div>
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label">TTL</label>
                        <input type="number" class="form-control" v-model="newItem.ttl" min="1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">优先级</label>
                        <input type="number" class="form-control" v-model="newItem.priority" min="0">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <label class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" v-model="newItem.proxied">
                            <span class="form-check-label">启用代理</span>
                        </label>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" rows="2" v-model="newItem.remark"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" @click="createDnsRecord">创建</button>
            </div>
        </div>
    </div>
</div>

<div class="modal modal-blur fade" id="dns-record-editModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑 DNS 记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label required">类型</label>
                    <select class="form-select" :class="{ 'is-invalid': validationErrors.type }" v-model="editedItem.type">
                        <option v-for="recordType in dnsRecordTypes" :key="recordType" :value="recordType">{{ recordType }}</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label required">名称</label>
                    <input type="text" class="form-control" :class="{ 'is-invalid': validationErrors.name }" v-model="editedItem.name">
                </div>
                <div class="mb-3">
                    <label class="form-label required">内容</label>
                    <textarea class="form-control" rows="3" :class="{ 'is-invalid': validationErrors.content }" v-model="editedItem.content"></textarea>
                </div>
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label">TTL</label>
                        <input type="number" class="form-control" v-model="editedItem.ttl" min="1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">优先级</label>
                        <input type="number" class="form-control" v-model="editedItem.priority" min="0">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <label class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" v-model="editedItem.proxied">
                            <span class="form-check-label">启用代理</span>
                        </label>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" rows="2" v-model="editedItem.remark"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" @click="updateDnsRecord">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal modal-blur fade" id="dns-record-batchCreateModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">批量新增 DNS 记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-hint mb-2">每行一条，格式：`类型,名称,内容,TTL,优先级,是否代理(0/1),备注`</div>
                <textarea class="form-control" rows="10" v-model="dnsBatchCreateText" placeholder="A,@,1.2.3.4,120,,0,主站&#10;CNAME,www,@,300,,0,网站别名"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" @click="submitDnsBatchCreate">执行批量新增</button>
            </div>
        </div>
    </div>
</div>

<div class="modal modal-blur fade" id="dns-record-batchUpdateModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">批量修改 DNS 记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info">将对已选中的 {{ selectedRecordIds.length }} 条记录应用以下字段。</div>
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label">TTL</label>
                        <input type="number" class="form-control" v-model="dnsBatchUpdateForm.ttl" min="1" placeholder="留空不改">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">优先级</label>
                        <input type="number" class="form-control" v-model="dnsBatchUpdateForm.priority" min="0" placeholder="留空不改">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <label class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" :checked="dnsBatchUpdateForm.proxied === true" @change="dnsBatchUpdateForm.proxied = $event.target.checked ? true : null">
                            <span class="form-check-label">批量设为代理</span>
                        </label>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" rows="3" v-model="dnsBatchUpdateForm.remark" placeholder="留空不改"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" @click="submitDnsBatchUpdate">执行批量修改</button>
            </div>
        </div>
    </div>
</div>

<div class="modal modal-blur fade" id="dns-record-deleteModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-body">
                <div class="modal-title">确定删除吗?</div>
                <div>确认后将删除当前 DNS 记录或将其标记为待删除。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" @click="deleteDnsRecordConfirmed">确认</button>
            </div>
        </div>
    </div>
</div>
