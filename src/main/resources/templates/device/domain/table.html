<table class="table table-selectable card-table table-vcenter text-nowrap datatable">
    <thead>
    <tr>
        <th>ID</th>
        <th>域名</th>
        <th>DNS服务商</th>
        <th>同步状态</th>
        <th>最近同步</th>
        <th>到期日</th>
        <th>状态</th>
        <th>价格</th>
        <th>备注</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr v-for="domain in records" :key="domain.id">
        <td v-text="domain.id"></td>
        <td>
            <a :href="'http://' + domain.domain" target="_blank" class="text-reset">{{ domain.domain }}</a>
        </td>
        <td>
            <div class="fw-medium" v-text="domain.dnsProviderName || '-'"></div>
            <div class="text-secondary small" v-text="domain.dnsZoneId || '未绑定'"></div>
        </td>
        <td>
            <span class="badge" :class="getDnsSyncBadgeClass(domain)">
                {{ getDnsSyncDescription(domain) }}
            </span>
        </td>
        <td v-text="formatDateTime(domain.dnsLastSyncTime) || '-'"></td>
        <td v-text="formatDate(domain.expireDate)"></td>
        <td>
            <span class="badge" :class="getStatusBadgeClass(domain.daysUntilExpiration)">
                {{ getDomainStatus(domain.daysUntilExpiration) }}
            </span>
        </td>
        <td>¥ {{ domain.price ? domain.price.toFixed(2) : '-' }}</td>
        <td v-text="domain.remark || '-'"></td>
        <td>
            <div class="btn-list flex-nowrap">
                <button v-if="isDnsPulling(domain.id)" class="btn btn-sm btn-muted" type="button" disabled>
                    <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                    拉取中
                </button>
                <button v-else-if="isDnsPushing(domain.id)" class="btn btn-sm btn-muted" type="button" disabled>
                    <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                    推送中
                </button>
                <div v-else class="dropdown position-static">
                    <button class="btn btn-sm dropdown-toggle align-text-top" data-bs-toggle="dropdown">
                        操作
                    </button>
                    <div class="dropdown-menu dropdown-menu-end">
                        <a class="dropdown-item" href="#" @click.prevent="navigateToDnsRecords(domain)">
                            <i class="ti ti-list-details"></i> 查看DNS记录
                        </a>
                        <a class="dropdown-item" href="#" @click.prevent="openDnsBindingModal(domain)">
                            <i class="ti ti-plug-connected"></i> 切换DNS服务商
                        </a>
                        <a class="dropdown-item" href="#" @click.prevent="pullDnsRecords(domain)">
                            <i class="ti ti-refresh"></i> 拉取DNS记录
                        </a>
                        <a class="dropdown-item" href="#" @click.prevent="pushDnsRecords(domain)">
                            <i class="ti ti-upload"></i> 推送DNS记录
                        </a>
                        <a class="dropdown-item" href="#" @click.prevent="openRenewDomainModal(domain)">
                            <i class="ti ti-calendar-plus"></i> 续期
                        </a>
                        <a class="dropdown-item" href="#" @click.prevent="openEditModal(domain)">
                            <i class="ti ti-edit"></i> 编辑
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-danger" href="#" @click.prevent="confirmDelete(domain)">
                            <i class="ti ti-trash"></i> 删除
                        </a>
                    </div>
                </div>
            </div>
        </td>
    </tr>
    <tr v-if="loading">
        <td colspan="10" class="text-center py-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </td>
    </tr>
    <tr v-else-if="records.length === 0">
        <td colspan="10" class="text-center py-3">没有查到数据.</td>
    </tr>
    </tbody>
</table>
