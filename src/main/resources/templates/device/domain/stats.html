<div class="card-body border-bottom">
    <div class="row g-2">
        <div class="col-3">
            <div class="text-center">
                <div class="text-primary fw-bold h4 mb-0">{{ totalItems || 0 }}</div>
                <div class="text-muted small">总域名</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-danger fw-bold h4 mb-0">{{ stats.expiredCount || 0 }}</div>
                <div class="text-muted small">已过期</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-warning fw-bold h4 mb-0">{{ stats.expiringCount || 0 }}</div>
                <div class="text-muted small">30天内到期</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-info fw-bold h4 mb-0">¥ {{ (stats.totalCost || 0).toFixed(2) }}</div>
                <div class="text-muted small">总成本</div>
            </div>
        </div>
    </div>
</div>
