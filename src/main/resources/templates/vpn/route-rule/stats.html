<div class="card-body border-bottom">
    <div class="row g-2">
        <div class="col-3">
            <div class="text-center">
                <div class="text-primary fw-bold h4 mb-0">{{ stats.total || 0 }}</div>
                <div class="text-muted small">总规则</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-success fw-bold h4 mb-0">{{ stats.enabled || 0 }}</div>
                <div class="text-muted small">已启用</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-info fw-bold h4 mb-0">{{ stats.xray || 0 }}</div>
                <div class="text-muted small">Xray</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-warning fw-bold h4 mb-0">{{ stats.singBox || 0 }}</div>
                <div class="text-muted small">Sing-box</div>
            </div>
        </div>
    </div>
</div>
