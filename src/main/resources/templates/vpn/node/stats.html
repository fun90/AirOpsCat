<div class="card-body border-bottom">
    <div class="row g-2">
        <div class="col-3">
            <div class="text-center">
                <div class="text-primary fw-bold h4 mb-0">{{ stats.total || 0 }}</div>
                <div class="text-muted small">总节点</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-success fw-bold h4 mb-0">{{ stats.active || 0 }}</div>
                <div class="text-muted small">活跃</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-info fw-bold h4 mb-0">{{ stats.proxy || 0 }}</div>
                <div class="text-muted small">代理</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-warning fw-bold h4 mb-0">{{ stats.landing || 0 }}</div>
                <div class="text-muted small">落地</div>
            </div>
        </div>
    </div>
</div>
