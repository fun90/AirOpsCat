<div class="card-body border-top border-bottom">
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-secondary" @click="openBatchDeployModal">
                <i class="ti ti-rocket"></i> 批量部署
            </button>
            <button class="btn btn-outline-primary" @click="openCoreSwitchModal" :disabled="selectedNodeIds.length === 0">
                <i class="ti ti-cpu"></i> 切换内核
            </button>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2 text-muted small">
            <span>已选 {{ selectedNodeIds.length }} 个节点</span>
            <span v-if="activeFilterCount() > 0" class="badge bg-azure-lt text-azure">已启用 {{ activeFilterCount() }} 个筛选</span>
        </div>
    </div>
</div>
