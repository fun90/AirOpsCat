<div class="page-body">
    <div class="container-xl">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-none d-lg-block pb-3">
                        <div class="text-uppercase text-muted fw-bold small mb-3">筛选节点</div>
                        <div class="row g-3 align-items-center">
                            <div class="col">
                                <input type="text" class="form-control" placeholder="搜索节点名称、编号、备注" v-model="searchQuery" @input="searchDebounced">
                            </div>
                            {#include vpn/node/filters /}
                        </div>
                    </div>

                    <div class="row g-3 align-items-center">
                        <div class="col-12 d-lg-none">
                            <div class="d-flex gap-2">
                                <input type="text" class="form-control" placeholder="搜索节点名称、编号、备注" v-model="searchQuery" @input="searchDebounced">
                                <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#nodeFilterOffcanvas" aria-controls="nodeFilterOffcanvas">
                                    <i class="ti ti-adjustments-horizontal"></i>
                                    <span class="d-none d-sm-inline">筛选</span>
                                    <span v-if="activeFilterCount() > 0" class="badge bg-primary text-white ms-1">{{ activeFilterCount() }}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div v-if="hasActiveFilters()" class="mt-3 d-lg-none">
                        <div class="d-flex flex-wrap gap-2">
                            <button
                                    v-for="tag in getActiveFilterTags()"
                                    :key="tag.key"
                                    type="button"
                                    class="badge bg-azure-lt text-azure border-0 d-inline-flex align-items-center gap-1"
                                    @click="clearFilter(tag.key)">
                                <span>{{ tag.label }}: {{ tag.value }}</span>
                                <i class="ti ti-x small"></i>
                            </button>
                            <button type="button" class="badge bg-secondary-lt text-secondary border-0" @click="resetFilters">
                                清空筛选
                            </button>
                        </div>
                    </div>
                </div>

                {#include vpn/node/toolbar /}
                {#include vpn/node/stats /}

                <div class="table-responsive">
                    {#include vpn/node/table /}
                </div>

                {#include pagination-controls /}
            </div>
        </div>

        {#include vpn/node/mobile-filter-drawer /}
        {#include vpn/node/modals /}
    </div>
</div>
