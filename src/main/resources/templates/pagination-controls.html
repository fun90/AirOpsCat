<div class="card-footer d-flex flex-column flex-sm-row align-items-sm-center gap-3">
    <div class="d-flex flex-column flex-sm-row align-items-sm-center gap-2 text-secondary">
        <div class="d-flex align-items-center gap-2">
            <span>每页</span>
            <select class="form-select form-select-sm w-auto" v-model="pageSize" @change="changePageSize">
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
            <span>条</span>
        </div>
    </div>
    <div class="ms-sm-auto">
        <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
            <span class="text-secondary small">第 {{ currentPage }} / {{ totalPages || 1 }} 页</span>
            <ul class="pagination m-0 ms-auto" v-if="totalPages > 0">
                <li class="page-item" :class="{ disabled: currentPage === 1 }">
                    <a class="page-link" href="#" @click.prevent="prevPage">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">
                            <path d="M15 6l-6 6l6 6" />
                        </svg>
                    </a>
                </li>
                <!-- Display page numbers dynamically -->
                <li class="page-item" v-for="page in paginationPages()" :key="page" :class="{ active: page === currentPage }">
                    <a class="page-link" href="#" @click.prevent="goToPage(page)">{{ page }}</a>
                </li>
                <li class="page-item" :class="{ disabled: currentPage === totalPages }">
                    <a class="page-link" href="#" @click.prevent="nextPage">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">
                            <path d="M9 6l6 6l-6 6" />
                        </svg>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
