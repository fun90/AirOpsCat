<div class="card-body border-bottom">
    <div class="row g-2">
        <div class="col-3">
            <div class="text-center">
                <div class="text-primary fw-bold h4 mb-0">¥ {{ formatCurrency(parseFloat(stats.totalIncome) + parseFloat(stats.totalExpense)) }}</div>
                <div class="text-muted small">总交易额</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-success fw-bold h4 mb-0">¥ {{ formatCurrency(stats.totalIncome) }}</div>
                <div class="text-muted small">总收入</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="text-danger fw-bold h4 mb-0">¥ {{ formatCurrency(stats.totalExpense) }}</div>
                <div class="text-muted small">总支出</div>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <div class="fw-bold h4 mb-0" :class="parseFloat(stats.netBalance) >= 0 ? 'text-success' : 'text-danger'">¥ {{ formatCurrency(stats.netBalance) }}</div>
                <div class="text-muted small">净收入</div>
            </div>
        </div>
    </div>
</div>

<!-- 收支趋势图 -->
<div class="card-body border-bottom">
    <h3 class="card-title">收支趋势</h3>
    <div class="chart-container" style="height: 350px;">
        <div id="trends-chart" style="width: 100%; height: 100%"></div>
    </div>
</div>
