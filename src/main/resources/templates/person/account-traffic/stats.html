<div class="card-body border-bottom">
    <div class="row g-2">
        <div class="col-4">
            <div class="text-center">
                <div class="text-primary fw-bold h4 mb-0">{{ totalUploadFormatted }}</div>
                <div class="text-muted small">上传流量</div>
            </div>
        </div>
        <div class="col-4">
            <div class="text-center">
                <div class="text-success fw-bold h4 mb-0">{{ totalDownloadFormatted }}</div>
                <div class="text-muted small">下载流量</div>
            </div>
        </div>
        <div class="col-4">
            <div class="text-center">
                <div class="text-info fw-bold h4 mb-0">{{ formatBytes(totalUpload + totalDownload) }}</div>
                <div class="text-muted small">总流量</div>
            </div>
        </div>
    </div>
</div>
