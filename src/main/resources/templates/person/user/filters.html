<div class="{#if layout == 'mobile'}col-12{#else}col-auto{/if}">
    {#if layout == 'mobile'}
        <label class="form-label">角色</label>
    {/if}
    <select class="form-select" v-model="filters.role" @change="currentPage = 1; fetchRecords()" style="{#if layout == 'desktop'}width: 120px;{/if}">
        <option value="">全部角色</option>
        <option value="ADMIN">ADMIN</option>
        <option value="PARTNER">PARTNER</option>
        <option value="VIP">VIP</option>
    </select>
</div>

<div class="{#if layout == 'mobile'}col-12{#else}col-auto{/if}">
    {#if layout == 'mobile'}
        <label class="form-label">状态</label>
    {/if}
    <select class="form-select" v-model="filters.status" @change="currentPage = 1; fetchRecords()" style="{#if layout == 'desktop'}width: 120px;{/if}">
        <option value="">全部状态</option>
        <option value="active">正常</option>
        <option value="locked">锁定中</option>
        <option value="disabled">已禁用</option>
    </select>
</div>
