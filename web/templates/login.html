{{template "head" .}}
<body class="d-flex flex-column">
<div class="page page-center">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <img src="/static/img/logo-light.png" height="96" alt="AirOpsCat">
        </div>
        <div class="card card-md">
            <div class="card-body">
                <h1 class="h2 text-center mb-4">登录</h1>
                {{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}
                <form method="post" action="/login" autocomplete="on">
                    <div class="mb-3">
                        <label class="form-label" for="email">邮箱</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{.Email}}" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">密码</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-check">
                            <input type="checkbox" class="form-check-input" name="remember" value="on">
                            <span class="form-check-label">14 天内保持登录</span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
