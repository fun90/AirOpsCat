{{define "content"}}{{with .Form}}
<form method="post" action="{{if .ID}}/admin/transactions/{{.ID}}{{else}}/admin/transactions{{end}}" class="card"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="back" value="{{$.Back}}">
<div class="card-body">{{if $.FormErr}}<div class="alert alert-danger" role="alert">{{$.FormErr}}</div>{{end}}<div class="row g-3">
<div class="col-12 col-md-4"><label for="transaction_date" class="form-label required">发生时间</label><input id="transaction_date" name="transaction_date" type="datetime-local" step="1" class="form-control" value="{{.TransactionDate}}" required></div>
<div class="col-6 col-md-4"><label for="type" class="form-label required">类型</label><select id="type" name="type" class="form-select" required><option value="0"{{if eq .Type "0"}} selected{{end}}>收入</option><option value="1"{{if eq .Type "1"}} selected{{end}}>支出</option></select></div>
<div class="col-6 col-md-4"><label for="amount" class="form-label required">金额（元）</label><input id="amount" name="amount" inputmode="decimal" class="form-control" value="{{.Amount}}" required></div>
<div class="col-12"><label for="business_ref" class="form-label">关联业务</label><select id="business_ref" name="business_ref" class="form-select" data-search><option value="">不关联业务</option>{{range $.BusinessOptions}}<option value="{{.Table}}:{{.ID}}"{{if eq (printf "%s:%d" .Table .ID) $.Form.BusinessRef}} selected{{end}}>{{if eq .Table "account"}}账户{{else if eq .Table "domain"}}域名{{else}}服务器{{end}}：{{.Name}}</option>{{end}}</select></div>
<div class="col-12 col-md-6"><label for="payment_method" class="form-label">付款方式</label><select id="payment_method" name="payment_method" class="form-select"><option value="">未填写</option>{{range $.PaymentMethods}}<option value="{{.}}"{{if eq . $.Form.PaymentMethod}} selected{{end}}>{{if eq . "WeChat"}}微信{{else if eq . "AliPay"}}支付宝{{else}}银行卡{{end}}</option>{{end}}</select></div>
<div class="col-12 col-md-6"><label for="description" class="form-label">说明</label><input id="description" name="description" maxlength="255" class="form-control" value="{{.Description}}"></div>
<div class="col-12"><label for="remark" class="form-label">备注</label><textarea id="remark" name="remark" maxlength="255" class="form-control" rows="3">{{.Remark}}</textarea></div>
</div></div><div class="card-footer"><button type="submit" class="btn btn-primary">保存</button><a href="{{if $.Back}}{{$.Back}}{{else}}/admin/transactions{{end}}" class="btn btn-link">取消</a></div></form>
{{end}}{{end}}
