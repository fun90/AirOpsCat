{{define "content"}}
<p class="text-secondary">{{.Account.Remark}} · {{.Account.AccountNo}}</p>
<form method="post" action="/admin/accounts/{{.Account.ID}}/bindings" class="card mb-3"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="from" value="{{.From}}"><div class="card-header"><h3 class="card-title">新增 / 更新订阅定制</h3></div><div class="card-body"><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="placement_id">节点 / 部署位</label><select class="form-select" name="placement_id" id="placement_id" required data-search data-placement><option value="">请选择</option>{{range .Choices}}<option value="{{.PlacementID}}" data-records="{{json .Records}}">{{.NodeName}} → {{.ServerName}}（{{.IP}}）</option>{{end}}</select></div>
<div class="col-md-6"><div class="d-flex justify-content-between"><label class="form-label" for="record_id">连接域名</label><a href="#" class="small ms-2" data-toggle-new-domain>新增域名</a></div><select class="form-select" name="record_id" id="record_id" data-record data-empty="不覆盖，使用部署位默认地址"></select><div class="form-hint">仅列出与所选部署位相关的域名</div></div><div class="col-12" data-new-domain hidden><div class="row g-2"><div class="col-md-6"><label class="form-label">子域名</label><input class="form-control" name="new_name" placeholder="如 hk01" autocomplete="off"></div><div class="col-md-6"><label class="form-label">主域名</label><select class="form-select" name="new_domain_id">{{range $.Domains}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></div><div class="form-hint">将创建指向该部署位服务器 IP 的 A 记录（待创建，解析下发在 DNS 阶段处理）。</div></div></div>
<div class="col-md-9"><label class="form-label" for="binding_remark">备注</label><input class="form-control" name="remark" id="binding_remark"></div><div class="col-md-3 d-flex align-items-end"><label class="form-check mb-2"><input class="form-check-input" name="enabled" type="checkbox" value="1" checked><span class="form-check-label">启用</span></label></div>
</div></div><div class="card-footer text-end"><a href="{{if .From}}/admin/accounts/{{.Account.ID}}/edit{{else}}/admin/accounts{{end}}" class="btn btn-link">取消</a><button class="btn btn-primary">保存定制</button></div></form>
{{range .List}}<form method="post" action="/admin/accounts/{{$.Account.ID}}/bindings" class="card mb-3"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="from" value="{{$.From}}"><input type="hidden" name="binding_id" value="{{.ID}}"><div class="card-header"><h3 class="card-title">{{.NodeName}}</h3></div><div class="card-body"><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="placement_{{.ID}}">展示部署位</label><select class="form-select" name="placement_id" id="placement_{{.ID}}" required data-search data-placement>{{$b:=.}}{{range $.Choices}}{{if eq .NodeID $b.NodeID}}<option value="{{.PlacementID}}" data-records="{{json .Records}}"{{if eq .PlacementID $b.PlacementID}} selected{{end}}>{{.ServerName}}（{{.IP}}）</option>{{end}}{{end}}</select></div>
<div class="col-md-6"><div class="d-flex justify-content-between"><label class="form-label" for="record_{{.ID}}">连接域名</label><a href="#" class="small ms-2" data-toggle-new-domain>新增域名</a></div><select class="form-select" name="record_id" id="record_{{.ID}}" data-record data-empty="不覆盖"{{if .RecordID}} data-current="{{deref .RecordID}}" data-current-name="{{.RecordName}}"{{end}}></select></div><div class="col-12" data-new-domain hidden><div class="row g-2"><div class="col-md-6"><label class="form-label">子域名</label><input class="form-control" name="new_name" placeholder="如 hk01" autocomplete="off"></div><div class="col-md-6"><label class="form-label">主域名</label><select class="form-select" name="new_domain_id">{{range $.Domains}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></div><div class="form-hint">将创建指向该部署位服务器 IP 的 A 记录（待创建，解析下发在 DNS 阶段处理）。</div></div></div>
<div class="col-md-9"><label class="form-label" for="remark_{{.ID}}">备注</label><input class="form-control" name="remark" id="remark_{{.ID}}" value="{{.Remark}}"></div><div class="col-md-3 d-flex align-items-end"><label class="form-check mb-2"><input class="form-check-input" name="enabled" type="checkbox" value="1"{{if .Enabled}} checked{{end}}><span class="form-check-label">启用</span></label></div>
</div></div><div class="card-footer text-end"><button class="btn btn-outline-danger me-2" formaction="/admin/accounts/{{$.Account.ID}}/bindings/{{.ID}}/delete" formnovalidate onclick="return confirm('确定删除该订阅定制？')">删除</button><a href="{{if $.From}}/admin/accounts/{{$.Account.ID}}/edit{{else}}/admin/accounts{{end}}" class="btn btn-link">取消</a><button class="btn btn-primary">保存</button></div></form>{{else}}<p class="text-secondary">尚无订阅定制</p>{{end}}
{{end}}
