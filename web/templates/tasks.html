{{define "content"}}
<div class="card"><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th>任务</th><th>上次开始</th><th>状态 / 结果</th><th></th></tr></thead><tbody>{{range $key,$t:=.Tasks}}<tr><td>{{$t.Name}}</td><td>{{$t.Last}}</td><td>{{if $t.Running}}运行中{{else}}{{$t.Result}}{{end}}</td><td><form method="post" action="/admin/tasks/{{$key}}/run"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button class="btn btn-sm btn-primary"{{if $t.Running}} disabled{{end}}>执行一次</button></form></td></tr>{{end}}</tbody></table></div></div>
{{end}}
