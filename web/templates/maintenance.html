{{define "content"}}
<form class="card" data-maintenance-batch{{if .Preselect}} data-maintenance-init{{end}}>
<input type="hidden" name="csrf" value="{{.CSRF}}">
<div class="card-header"><h3 class="card-title">批量执行维护脚本</h3></div>
<div class="card-body">
<div class="row g-3"><div class="col-12 col-md-6"><label class="form-label required" for="maintenance-server">目标服务器</label><select class="form-select" id="maintenance-server" name="server_id" multiple required data-search>{{range .Servers}}<option value="{{.ID}}"{{if eq .ID $.Preselect}} selected{{end}}>{{.Name}} · {{.IP}}</option>{{end}}</select></div></div>
<div class="alert alert-warning mt-3">按编号顺序执行，失败即停；执行期间保持页面打开。脚本可能重启服务、替换 SSH 公钥或修改防火墙。</div>
<div class="d-flex flex-wrap gap-2 mb-3"><button type="button" class="btn btn-sm btn-outline-primary" data-maintenance-select="init">选择 01～10</button><button type="button" class="btn btn-sm btn-outline-secondary" data-maintenance-select="all">全选</button><button type="button" class="btn btn-sm btn-outline-secondary" data-maintenance-select="none">清空</button><span class="text-secondary small align-self-center" data-maintenance-count>已选 0 项</span></div>
<div class="list-group list-group-flush">
{{range .Scripts}}<div class="list-group-item px-0" data-maintenance-row>
<div class="d-flex gap-2 align-items-start"><input type="checkbox" class="form-check-input mt-1 flex-shrink-0" name="scripts" value="{{.Name}}" data-hash="{{.Hash}}" id="script-{{.Name}}"><div class="flex-fill" style="min-width:0"><label class="form-label mb-1 text-break" for="script-{{.Name}}">{{.Name}} · {{.Title}}</label><div class="text-secondary small">{{.Description}}</div><details class="mt-2"><summary>预览脚本</summary><pre class="p-3 mt-2 border rounded text-break" style="max-height:24rem;white-space:pre-wrap"><code>{{.Body}}</code></pre></details></div><span class="badge bg-secondary-lt flex-shrink-0" data-maintenance-status>未选择</span></div>
</div>{{else}}<div class="text-secondary py-3">脚本目录中暂无可执行脚本。</div>{{end}}
</div>
<div class="mt-3" data-maintenance-key hidden><label class="form-label required" for="maintenance-public-key">03 · 要保留的 SSH 公钥</label><textarea id="maintenance-public-key" name="public_key" class="form-control" rows="3"></textarea><div class="form-hint">将替换 root 原有公钥，请先在服务器配置中保存对应私钥。</div></div>
<div class="mt-3" data-maintenance-email hidden><label class="form-label required" for="maintenance-acme-email">04 · ACME 注册邮箱</label><input id="maintenance-acme-email" name="acme_email" type="email" class="form-control" autocomplete="email"><div class="form-hint">用于证书到期通知</div></div>
<label class="form-check mt-3"><input type="checkbox" class="form-check-input" name="confirm" value="run" required><span class="form-check-label">已阅读所选脚本，确认在目标服务器执行</span></label>
<div class="mt-3" role="status" aria-live="polite" data-maintenance-result></div>
</div><div class="card-footer text-end"><button type="submit" class="btn btn-danger" data-maintenance-run>执行所选脚本</button></div>
</form>
{{end}}
