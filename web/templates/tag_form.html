{{define "content"}}
<form method="post" action="/admin/tags/{{.Tag.ID}}" class="card" style="max-width: 560px">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <div class="card-body">
        <div class="mb-3"><label class="form-label required" for="name">名称</label><input class="form-control" id="name" name="name" value="{{.Tag.Name}}" required maxlength="64"></div>
        <div class="mb-3"><label class="form-label" for="description">说明</label><input class="form-control" id="description" name="description" value="{{.Tag.Description}}"></div>
        <div class="mb-3"><label class="form-label" for="color">颜色</label><input type="color" class="form-control form-control-color" id="color" name="color" value="{{if .Tag.Color}}{{.Tag.Color}}{{else}}#206bc4{{end}}"></div>
    </div>
    <div class="card-footer text-end"><a href="/admin/tags" class="btn btn-link">取消</a><button class="btn btn-primary" type="submit">保存</button></div>
</form>
{{end}}
