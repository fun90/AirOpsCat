# AirOpsCat Subscription Config for Clash Verge
# Generated at: {{text $.timestamp}}
# Account: {{text $.account.uuid}}

mode: rule
ipv6: false
log-level: info
allow-lan: false
unified-delay: true
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb

mixed-port: 7890

tun:
  enable: true
  stack: system
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
    - udp://any:53

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "*.pool.ntp.org"
    - "time.apple.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "msftconnecttest.com"
    - "msftncsi.com"
    - "*.arpa"
    - "+.steampowered.com"
    - "+.steamcontent.com"
    - "+.steamserver.net"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    - "*.fun90.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://cloudflare-dns.com/dns-query#代理
    - https://dns.google/dns-query#代理
  nameserver-policy:
    "+.fun90.com":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:hst":
      - {{default "system" (get $ "dns")}}
    "rule-set:mydirect":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:China_Domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

profile:
  store-selected: true

proxies:
{{range $i, $node := $.nodes}}{{if (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality"))}}  - name: {{text $node.name}}
    type: vless
    server: {{text $node.serverHost}}
    port: {{text $node.port}}
    uuid: {{text $.account.uuid}}
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
{{if (eq $node.protocol "vless-reality")}}{{if (eq $node.coreType "sing-box")}}    servername: {{text $node.inbound.tls.server_name}}
    reality-opts:
      public-key: {{text $node.inbound.tls.reality.public_key}}
      short-id: {{text (index $node.inbound.tls.reality.short_id 0)}}
{{else if (eq $node.coreType "xray")}}    servername: {{text (index $node.inbound.streamSettings.realitySettings.serverNames 0)}}
    reality-opts:
      public-key: {{text $node.inbound.streamSettings.realitySettings.publicKey}}
      short-id: {{text (index $node.inbound.streamSettings.realitySettings.shortIds 0)}}
{{end}}{{else}}    skip-cert-verify: true
{{end}}    client-fingerprint: chrome
{{end}}{{if (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box"))}}  - name: {{text $node.name}}
    type: hysteria2
    server: {{text $node.serverHost}}
    port: {{text $node.port}}
    password: {{text $.account.uuid}}
    obfs: salamander
    obfs-password: {{text $node.inbound.obfs.password}}
    sni: {{text $node.inbound.tls.server_name}}
    skip-cert-verify: true
    client-fingerprint: chrome
    alpn:
      - h3
    udp: true
{{end}}{{if (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box"))}}  - name: {{text $node.name}}
    type: ss
    server: {{text $node.serverHost}}
    port: {{text $node.port}}
    cipher: chacha20-ietf-poly1305
    password: {{text $.account.uuid}}
    udp: false
    plugin: shadow-tls
    plugin-opts:
      host: {{text $node.inbound.handshake.server}}
      password: {{text (index $node.inbound.users 0).password}}
      version: 3
{{end}}{{end}}
proxy-groups:
  - name: 代理
    icon: https://static.fun90.com/clash/Proxy.png
    type: select
    proxies:
{{if (gt (len $.nodes) 1)}}      - 自动
{{end}}{{range $i, $node := $.nodes}}{{if (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box")))}}      - {{text $node.name}}
{{end}}{{end}}      - 直连
  - name: GitHub
    icon: https://static.fun90.com/clash/GitHub.png
    type: select
    proxies:
      - 代理
      - 直连
{{range $i, $node := $.nodes}}{{if (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box")))}}      - {{text $node.name}}
{{end}}{{end}}  - name: Microsoft
    icon: https://static.fun90.com/clash/Microsoft.png
    type: select
    proxies:
      - 直连
      - 代理
{{range $i, $node := $.nodes}}{{if (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box")))}}      - {{text $node.name}}
{{end}}{{end}}  - name: HST
    icon: https://static.fun90.com/clash/hst.svg
    type: select
    proxies:
      - 直连
      - 代理
{{range $i, $node := $.nodes}}{{if (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box")))}}      - {{text $node.name}}
{{end}}{{end}}  - name: Broker
    icon: https://static.fun90.com/clash/Broker.png
    type: select
    proxies:
      - 代理
      - 直连
{{range $i, $node := $.nodes}}{{if (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box")))}}      - {{text $node.name}}
{{end}}{{end}}  - name: Football
    icon: https://static.fun90.com/clash/football.svg
    type: select
    proxies:
{{range $i, $node := $.nodes}}{{if (and (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box"))) (or (contains $node.name "新加坡") (contains $node.name "日本")))}}      - {{text $node.name}}
{{end}}{{end}}      - 直连
  - name: Apple
    icon: https://static.fun90.com/clash/Apple.png
    type: select
    proxies:
      - 直连
      - 代理
{{range $i, $node := $.nodes}}{{if (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box")))}}      - {{text $node.name}}
{{end}}{{end}}{{if (gt (len $.nodes) 1)}}  - name: 自动
    icon: https://static.fun90.com/clash/Auto.png
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
{{range $i, $node := $.nodes}}{{if (and (or (eq $node.protocol "vless") (eq $node.protocol "vless-reality") (and (eq $node.protocol "hysteria2") (eq $node.coreType "sing-box")) (and (eq $node.protocol "shadowtls") (eq $node.coreType "sing-box"))) (or (contains $node.name "美国") (contains $node.name "新加坡") (contains $node.name "日本")))}}      - {{text $node.name}}
{{end}}{{end}}{{end}}  - name: 直连
    icon: https://static.fun90.com/clash/Direct.png
    type: select
    proxies:
      - DIRECT

