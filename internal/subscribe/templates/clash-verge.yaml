    interval: 86400
  Broker:
    type: http
    behavior: classical
    url: "{{text $.subscriptionUrl}}/rules/clash/hk-broker.yaml"
    path: ./ruleset/hk-broker.yaml
    interval: 86400
  football:
    type: http
    behavior: classical
    url: "{{text $.subscriptionUrl}}/rules/clash/football.yaml"
